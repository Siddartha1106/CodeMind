<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodeMind Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Highlight.js Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-title">
        <span class="brand-icon">&lt;/&gt;</span>
        CodeMind
      </div>
      <button id="mobileMenuClose" class="icon-btn" style="display:none;">✕</button>
    </div>

    <button id="newChat" class="new-chat-pill">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New chat
    </button>
    
    <div class="sidebar-nav">
      <a class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Library
      </a>
      <a class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        Projects
      </a>
      <a class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        Scheduled
      </a>
      <a class="nav-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        Plugins
      </a>
    </div>

    <div class="sidebar-divider"></div>
    <div class="section-label">RECENTS</div>
    <div id="history" class="history"></div>

    <div class="sidebar-bottom">
      <div id="userCard" class="user-card">
        <img id="userAvatar" class="avatar-badge" src="" alt="User">
        <div class="user-info">
          <div id="userName" class="user-name">Developer</div>
          <div id="userEmail" class="user-role">CodeMind Pro</div>
        </div>
      </div>
      
      <div class="side-actions">
        <button id="themeBtn" class="side-action">◐ Theme</button>
        <button id="exportBtn" class="side-action">⇩ Export</button>
        <a href="/auth/logout" id="logoutBtn" class="side-action danger-link">⎋ Logout</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <header>
      <div class="header-left">
        <button id="mobileMenu" class="icon-btn">☰</button>
      </div>

      <div class="header-center-pill">
        <button class="pill-option active">Chat</button>
        <select id="modelSelect" class="model-select">
          <!-- Populated via API -->
        </select>
      </div>

      <div class="header-right">
        <button id="deleteBtn" class="icon-btn" title="Delete conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <section id="chat" class="chat">
      <div id="welcome" class="welcome">
        <h1 id="heroGreeting" class="hero-greeting">Hey, Developer. Ready to dive in?</h1>

        <div class="composer-capsule">
          <div class="composer-top-row">
            <button class="attach-btn" title="Add attachment">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <textarea id="prompt" rows="1" placeholder="Ask anything..."></textarea>
          </div>

          <div class="composer-bottom-row">
            <div class="capsule-actions-left">
              <button class="capsule-tag">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                Think
              </button>
            </div>

            <div class="capsule-actions-right">
              <button class="mic-btn" title="Voice input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
              </button>
              <button id="sendBtn" class="send-circle" title="Send message">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="reference-actions">
          <button class="ref-action-btn" data-prompt="Generate code and project files for a complete full-stack web application.">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Generate code or app project
          </button>
          <button class="ref-action-btn" data-prompt="Debug and fix errors in my source code.">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            Debug or refactor code
          </button>
          <button class="ref-action-btn" data-prompt="Explain algorithms and software architecture step by step.">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            Explain code or architecture
          </button>
        </div>
      </div>

      <div id="messages"></div>
    </section>

    <footer id="footerComposer" class="composer-wrap" style="display:none;">
      <div class="composer-capsule" style="margin-bottom:0;">
        <div class="composer-top-row">
          <textarea id="promptChat" rows="1" placeholder="Ask anything..."></textarea>
        </div>
        <div class="composer-bottom-row">
          <div class="capsule-actions-left"></div>
          <div class="capsule-actions-right">
            <button id="sendBtnChat" class="send-circle" title="Send message">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="hint">CodeMind Studio can make mistakes. Review technical output before deployment.</div>
    </footer>
  </main>
</div>

<!-- Highlight.js Library for syntax highlighting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
