<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ChatGPT - CodeMind Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Highlight.js Theme -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button id="newChat" class="new-chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      New chat
    </button>
    
    <div class="side-label">TODAY</div>
    <div id="history" class="history"></div>

    <div class="sidebar-bottom">
      <div id="userCard" class="user-card">
        <img id="userAvatar" class="avatar-img" src="" alt="User">
        <div class="user-info">
          <div id="userName" class="user-name">Loading...</div>
          <div id="userEmail" class="user-email">...</div>
        </div>
      </div>
      
      <div class="side-actions">
        <button id="themeBtn" class="side-action">◐ Mode</button>
        <button id="exportBtn" class="side-action">⇩ Export</button>
        <a href="/auth/logout" id="logoutBtn" class="side-action danger-link">⎋ Logout</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <header>
      <div class="header-left">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div class="model-picker-wrap">
          <select id="modelSelect" class="model-select">
            <!-- Populated via API -->
          </select>
        </div>
      </div>
      
      <div class="header-right">
        <button id="deleteBtn" class="icon-btn" title="Delete conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <section id="chat" class="chat">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <h1>ChatGPT</h1>
        <p>How can I help you today?</p>

        <div class="suggestions">
          <button data-prompt="Build a FastAPI REST API with CRUD operations and SQLite database.">Build a FastAPI REST API</button>
          <button data-prompt="Debug this code. I will paste the code and stack trace next.">Debug code error</button>
          <button data-prompt="Explain this algorithm step by step with clear comments. I will paste it next.">Explain code step-by-step</button>
          <button data-prompt="Optimize and refactor this function for maximum performance and readability.">Optimize & refactor code</button>
        </div>
      </div>
      <div id="messages"></div>
    </section>

    <footer class="composer-wrap">
      <div class="composer">
        <textarea id="prompt" rows="1" placeholder="Send a message..."></textarea>
        <button id="sendBtn" class="send" title="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="hint">ChatGPT can make mistakes. Consider checking important information.</div>
    </footer>
  </main>
</div>

<!-- Highlight.js Library for syntax highlighting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
