services:
  - type: web
    name: codeforge-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: openrouter
      - key: DEFAULT_MODEL
        value: qwen/qwen-2.5-coder-32b-instruct
      - key: ALLOW_GUEST_LOGIN
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
    disk:
      name: sqlite-db
      mountPath: /app/data
      sizeGB: 1
